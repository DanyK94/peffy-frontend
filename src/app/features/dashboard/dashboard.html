
<section class="dashboard">
  <header class="dashboard-header">
    <div>
      <span class="eyebrow">FINANCIAL OVERVIEW</span>
      <h1>Analytics</h1>
      <p>Your financial activity at a glance.</p>
    </div>

    <select aria-label="Select month" class="month-select">
      <option>October 2026</option>
    </select>
  </header>

  <app-summary-cards
  [totalBalance]="totalBalance"
  [monthlyIncome]="monthlyIncome"
  [monthlyExpenses]="monthlyExpenses"
  />

  <section class="analytics-grid">
    <article class="dashboard-panel">
      <div class="panel-heading">
        <div>
          <h2>Cash flow</h2>
          <p>Income vs. expenses</p>
        </div>
      </div>
      <app-cash-flow-chart />
    </article>

    <article class="dashboard-panel">
      <div class="panel-heading">
        <div>
          <h2>Spending by category</h2>
          <p>Monthly expense breakdown</p>
        </div>
      </div>
      
      <app-spending-chart/>
    </article>
  </section>

  <section class="dashboard-panel activity-panel">
    <div class="panel-heading">
      <div>
        <h2>Recent activity</h2>
        <p>Your latest transactions</p>
      </div>
    </div>
    <app-recent-activity [transaction]="recentTransactions" />
  </section>
</section>
