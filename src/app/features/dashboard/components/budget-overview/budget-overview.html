
<section class="budget-list" aria-label="Monthly budgets">
  @for (item of budgets(); track item.categoryId) {
    <article class="budget-item">
      <div class="budget-heading">
        <div class="budget-category">
          <h3>{{ item.categoryName }}</h3>
          <span>
            {{ formatCurrency(item.spent) }}
            <span class="budget-separator">/</span>
            {{ formatCurrency(item.budget) }}
          </span>
        </div>

        <span
          class="budget-remaining"
          [class.over-budget]="item.remaining < 0"
        >
          {{ formatCurrency(item.remaining) }} left
        </span>
      </div>

      <div
        class="budget-progress"
        role="progressbar"
        [attr.aria-label]="item.categoryName + ' budget usage'"
        [attr.aria-valuenow]="getProgress(item.spent, item.budget)"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div
          class="budget-progress-fill"
          [class.over-budget-fill]="item.spent > item.budget"
          [style.width.%]="getProgress(item.spent, item.budget)"
        ></div>
      </div>
    </article>
  } @empty {
    <p class="empty-state">No budgets configured for this month.</p>
  }
</section>
